<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webcam</title>
</head>
<body>
    <h2 style="text-align: center;">Live Webcam Feed</h2>
    <div style="text-align: center;">
        <!-- Live video stream from Flask -->
        <video id="livefeed" autoplay width="640" height="480" style="border: 2px solid black;"></video>

        <br><br>

        <!-- Capture Button -->
        <button id="captureBtn" style="padding: 10px 20px; font-size: 16px;">Capture Image</button>

        <!-- Result below -->
        <div id="result" style="margin-top: 1em;"></div>

        <br>
        <a href="/" style="display: inline-block; margin-top: 20px;">Back to Home</a>
    </div>

<script>
  // Access webcam
  const video = document.getElementById("livefeed");
  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      video.srcObject = stream;
    })
    .catch(err => {
      alert("Webcam access denied or not available.");
      console.error(err);
    });

  document.getElementById("captureBtn").onclick = function () {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const context = canvas.getContext("2d");
    context.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      const formData = new FormData();
      formData.append("image", blob, "capture.png");

      fetch("/capture", {
        method: "POST",
        body: formData
      })
        .then(res => res.json())
        .then(data => {
          const output = document.getElementById("result");
          if (data.error) {
            alert("Error: " + data.message);
            output.innerHTML = `<p style="color:red;">Capture failed</p>`;
          } else {
            output.innerHTML = `
              <p><strong>Output:</strong> ${data.digest}</p>
            `;
            speak(data.digest);
          }
        })
        .catch(err => {
          alert("Failed to capture image: " + err);
        });
    }, "image/png");
  };

  function speak(text, rate = 1, pitch = 0.8) {
    const msg = new SpeechSynthesisUtterance();
    msg.text = text;
    msg.lang = 'en-US';
    msg.volume = 1;
    msg.rate = rate;
    msg.pitch = pitch;
    speechSynthesis.speak(msg);
  }
</script>

</body>
</html>
